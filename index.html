<!DOCTYPE html>
<html lang="en">

    <head>

    <body>
        
        <h1>Etch A Sketch!</h1>

        <div id="customisation">

            <button id="sideLengthButton">Adjust Grid</button>
            <button id="clearButton">Clear Grid</button>
            <p>Red:<input type="number" name="Red" placeholder="R" id="red" value="0"></p>
            <p>Green:<input type="number" name="Green" placeholder="G" id="green" value="0"></p>
            <p>Blue:<input type="number" name="Blue" placeholder="B" id="blue" value="0"></p>
            <p>To give a square a colour, click on it. Repeatedly click on it if you want to make it darker! To erase a square, double click on it!</p>
        
        </div>

        </div>
